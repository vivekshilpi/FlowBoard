<div class="auth-utility">
  <div class="auth-utility__card page-enter">
    <div class="auth-utility__header">
      <div class="auth-utility__icon"><mat-icon>lock_reset</mat-icon></div>
      <h1>Forgot password?</h1>
      <p>Enter your email and we’ll send a 6-digit OTP to reset your password.</p>
    </div>

    <div *ngIf="errorMessage" class="auth-utility__alert auth-utility__alert--danger">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="auth-utility__alert auth-utility__alert--success">
      <mat-icon>check_circle_outline</mat-icon>
      <span>{{ successMessage }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="field-stack">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="email" type="email" placeholder="name&#64;example.com" autocomplete="email" />
          <mat-error *ngIf="email.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="email.hasError('email')">Invalid email address</mat-error>
        </mat-form-field>
      </div>

      <button mat-flat-button class="btn btn-primary btn-lg auth-utility__submit" type="submit" [disabled]="loading || form.invalid">
        <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
        {{ loading ? 'Sending OTP...' : 'Send Reset OTP' }}
      </button>
    </form>

    <div class="auth-utility__footer">
      <a routerLink="/login" class="auth-utility__back-link">
        <mat-icon>arrow_back</mat-icon>
        Back to login
      </a>
    </div>
  </div>
</div>
