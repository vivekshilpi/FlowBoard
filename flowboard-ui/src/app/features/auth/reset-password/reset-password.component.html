<div class="auth-utility">
  <div class="auth-utility__card page-enter">
    <div class="auth-utility__header">
      <div class="auth-utility__icon"><mat-icon>vpn_key</mat-icon></div>
      <h1>Reset password</h1>
      <p>Enter the OTP sent to <strong>{{ email }}</strong> and choose a new secure password.</p>
    </div>

    <div *ngIf="errorMessage" class="auth-utility__alert auth-utility__alert--danger">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="auth-utility__alert auth-utility__alert--success">
      <mat-icon>check_circle_outline</mat-icon>
      <span>{{ successMessage }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="field-stack">
      <div class="form-group">
        <label class="form-label">Verification OTP</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="otp" placeholder="000000" maxlength="6" class="otp-code" />
          <mat-error *ngIf="otp.hasError('required')">OTP is required</mat-error>
          <mat-error *ngIf="otp.hasError('pattern')">Must be 6 digits</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <mat-form-field appearance="outline">
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="newPassword.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="newPassword.hasError('minlength')">At least 6 characters</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <mat-form-field appearance="outline">
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword" />
          <mat-error *ngIf="form.hasError('mismatch')">Passwords do not match</mat-error>
        </mat-form-field>
      </div>

      <button mat-flat-button class="btn btn-primary btn-lg auth-utility__submit" type="submit" [disabled]="loading || form.invalid">
        <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="auth-utility__footer">
      <a routerLink="/login" class="auth-utility__back-link">
        <mat-icon>arrow_back</mat-icon>
        Back to login
      </a>
    </div>
  </div>
</div>
